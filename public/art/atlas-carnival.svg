<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">The crooked midway</title><desc id="desc">A faded carnival tent, uneven ferris wheel, crooked ticket booths, and weeds beneath a tarnished moon.</desc>
<defs>
 <linearGradient id="night" x2=".1" y2="1"><stop stop-color="#281720"/><stop offset=".55" stop-color="#151015"/><stop offset="1" stop-color="#08090a"/></linearGradient>
 <radialGradient id="haze"><stop stop-color="#80505b" stop-opacity=".35"/><stop offset="1" stop-color="#80505b" stop-opacity="0"/></radialGradient>
 <linearGradient id="tent" x2="0" y2="1"><stop stop-color="#573044"/><stop offset="1" stop-color="#21131d"/></linearGradient>
 <pattern id="grain" width="31" height="31" patternUnits="userSpaceOnUse"><path d="M0 7h8M20 22h11M5 29h2" stroke="#d9c9a6" stroke-opacity=".08"/></pattern>
 <pattern id="stripes" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M0 0V44" stroke="#d9c9a6" stroke-opacity=".45" stroke-width="21"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
</defs>
