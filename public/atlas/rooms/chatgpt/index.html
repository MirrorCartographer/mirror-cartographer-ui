<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0a0d"><title>Leave a trace</title><style>:root{color-scheme:dark;--bg:#0b0a0d;--ink:#eee7df;--muted:#b1a5b4;--gold:#e2c48c;--line:#3c3344}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#302238,transparent 50%),var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;padding:20px}main{width:min(720px,100%);border:1px solid var(--line);padding:clamp(20px,5vw,48px);background:#111018e8}.eyebrow{font:10px ui-monospace,monospace;letter-spacing:.2em;color:var(--gold)}h1{font:400 clamp(3rem,8vw,6rem)/.9 Georgia,serif;margin:18px 0}p{color:var(--muted)}textarea,select{width:100%;background:#0b0b11;color:var(--ink);border:1px solid #51445c;padding:13px;margin:8px 0 16px;font:inherit}textarea{min-height:150px;resize:vertical}button,a{display:inline-block;padding:12px 15px;border:1px solid #6e5b7c;background:#20192a;color:var(--ink);text-decoration:none;font:10px ui-monospace,monospace;letter-spacing:.1em;cursor:pointer;margin:4px 6px 4px 0}button.primary{background:#e2c48c;color:#17130d;border-color:#e2c48c}button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid white;outline-offset:3px}.status{min-height:1.5em;font:11px ui-monospace,monospace;color:var(--gold)}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><main><a href="../">← RETURN TO THE ROOMS</a><p class="eyebrow">A SMALL OPENING</p><h1>Leave a<br>trace.</h1><p>Put something here. A sentence, a shape in words, a fragment you have not decided how to hold.</p><label class="eyebrow" for="fragment">THE FRAGMENT</label><textarea id="fragment" placeholder="It felt like…"></textarea><label class="eyebrow" for="direction">TURN IT TOWARD</label><select id="direction"><option value="mirror it without deciding what it means">A mirror</option><option value="map its parts, tensions, and relationships">A map</option><option value="gently challenge its assumptions and offer alternatives">A second angle</option><option value="turn it into an unusual sensory art encounter">An image</option><option value="ask one useful question and wait">One question</option></select><div><button class="primary" id="copy">COPY THE TRACE</button><button id="open">COPY & OPEN CHATGPT</button><a href="../">RETURN TO THE ROOM</a></div><p class="status" id="status" aria-live="polite">Nothing is sent automatically.</p></main><script>(()=>{const $=id=>document.getElementById(id);function prompt(){const value=$('fragment').value.trim();if(!value){$('status').textContent='Leave a fragment first.';return ''}return 'Meet this fragment with care and precision. Please '+$('direction').value+'. Do not diagnose me, impose a meaning, or turn uncertainty into certainty. Let the fragment change the direction of the encounter.\n\n'+value}async function copy(){const value=prompt();if(!value)return;try{await navigator.clipboard.writeText(value);$('status').textContent='Copied. The fragment stays here until you choose what to do with it.'}catch{$('status').textContent='Clipboard unavailable. Select and copy the text from the field.';const box=document.createElement('textarea');box.value=value;document.querySelector('main').append(box);box.select()}}$('copy').addEventListener('click',copy);$('open').addEventListener('click',async()=>{const value=prompt();if(!value)return;try{await navigator.clipboard.writeText(value);$('status').textContent='Copied. ChatGPT is opening; paste when ready.'}catch{$('status').textContent='Clipboard unavailable. Copy the fragment manually before opening ChatGPT.'}window.open('https://chatgpt.com/','_blank','noopener')});})();</script></body></html>
