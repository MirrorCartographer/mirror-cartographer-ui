<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veteran Mission Map</title><style>*{box-sizing:border-box}body{margin:0;background:#071019;color:#edf7ff;font:16px system-ui}.w{width:min(900px,94vw);margin:auto;padding:45px 0}.ey{color:#7ed8ff;letter-spacing:.18em;font-size:.7rem}h1{font-size:clamp(3rem,9vw,6rem);line-height:.85;margin:.4rem 0}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}label{color:#aebdca;font-size:.82rem}textarea{display:block;width:100%;min-height:130px;margin-top:7px;padding:13px;border-radius:14px;border:1px solid #ffffff18;background:#03080d;color:#fff;font:inherit}.row{margin-top:14px}button,a{display:inline-block;padding:11px 15px;border-radius:999px;border:1px solid #7ed8ff55;background:#ffffff08;color:#7ed8ff;text-decoration:none;cursor:pointer;margin:5px 5px 0 0}.out{margin-top:18px;padding:18px;border-radius:16px;background:#02060a;border:1px solid #ffffff12;white-space:pre-wrap;font-family:ui-monospace,monospace;color:#bfe8ff}.small{color:#8295a3;font-size:.8rem;line-height:1.5}</style></head><body><main class="w"><div class="ey">VETERAN COMMONS / PERSONAL MAP</div><h1>What comes<br>after service?</h1><p class="small">This local-only prototype helps turn an ideal life into a structured next-step map. Data stays in this browser unless you export it.</p><div class="g"><label>Ideal life<textarea id="ideal" placeholder="Where do you want to live? How do you want work, health, family and community to feel?"></textarea></label><label>Current constraints<textarea id="constraints" placeholder="Money, housing, health, transportation, schedule, records, relationships, access..."></textarea></label><label>Capabilities / contribution<textarea id="capability" placeholder="Skills, knowledge, lived experience, creative work, technical ability..."></textarea></label><label>Supports needed<textarea id="support" placeholder="Accommodations, services, equipment, people, environment..."></textarea></label><label>Resources to investigate<textarea id="resources" placeholder="VA benefits, VR&E, GI Bill, housing, family, employment..."></textarea></label><label>Next action<textarea id="next" placeholder="One concrete action that moves the map forward."></textarea></label></div><div class="row"><button onclick="save()">Save locally</button><button onclick="load()">Load</button><button onclick="exportJSON()">Export JSON</button><button onclick="clearAll()">Clear</button><a href="./">← Veteran Commons</a></div><div id="out" class="out">Build your map.</div></main><script>const ids=['ideal','constraints','capability','support','resources','next'];const key='mc-veteran-mission-v1';function get(){return Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]));}function render(msg){out.textContent=msg+'\n\n'+JSON.stringify(get(),null,2)}function save(){localStorage.setItem(key,JSON.stringify(get()));render('Saved locally.')}function load(){const d=JSON.parse(localStorage.getItem(key)||'null');if(!d)return render('No saved map.');ids.forEach(id=>document.getElementById(id).value=d[id]||'');render('Loaded.')}function clearAll(){localStorage.removeItem(key);ids.forEach(id=>document.getElementById(id).value='');render('Cleared.')}function exportJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(get(),null,2)],{type:'application/json'}));a.download='veteran-mission-map.json';a.click()}</script></body></html>
