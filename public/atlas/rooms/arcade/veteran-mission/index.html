<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veteran Mission</title><style>body{font-family:system-ui;background:#071019;color:white;margin:0;padding:30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.n{padding:25px;background:#ffffff12;border:1px solid #ffffff22;border-radius:15px;color:white;cursor:pointer}.done{background:#69d2ff;color:#071019}.out{margin-top:20px;padding:20px;background:#02060a;border-radius:15px}</style></head><body><h1>Veteran Mission</h1><p>Rebuild the map: choose each node in order.</p><div id="grid" class="grid"></div><div id="out" class="out">Start with Service.</div><script>const a=['Service','Records','Capacity','Pathway','Resources','Life'];let p=0;function draw(){grid.innerHTML=a.map((x,i)=>'<button class="n '+(i<p?'done':'')+'" onclick="pick('+i+')">'+(i+1)+'. '+x+'</button>').join('')}function pick(i){if(i===p){out.textContent=a[i]+' complete.';p++;if(p===a.length)out.textContent='Map complete. The next map is the life you build.';draw()}else out.textContent='Choose the next node in sequence.'}draw()</script></body></html>
