<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050510" />
    <meta name="description" content="Mirror Cartographer wordless sky-state interface." />
    <title>Mirror Cartographer</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #050510; overflow: hidden; }
      .boot-failsafe {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 62%, rgba(255,226,191,.24), transparent 22%),
          radial-gradient(circle at 18% 16%, rgba(125,211,252,.18), transparent 36%),
          radial-gradient(circle at 82% 12%, rgba(240,171,252,.16), transparent 32%),
          linear-gradient(180deg, #060718, #10162b 46%, #07070d);
      }
      .boot-failsafe i {
        width: min(34vw, 170px);
        aspect-ratio: 1;
        border: 2px solid rgba(255,226,191,.74);
        border-radius: 50%;
        box-shadow: 0 0 44px rgba(255,190,116,.42), inset 0 0 36px rgba(255,226,191,.18);
        animation: breathe 2.8s ease-in-out infinite;
      }
      @keyframes breathe { 50% { transform: scale(1.13); opacity: .68; } }
    </style>
  </head>
  <body>
    <div id="root"><main class="boot-failsafe" aria-label="Loading"><i aria-hidden="true"></i></main></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
