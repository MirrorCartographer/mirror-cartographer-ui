<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050510" />
    <meta name="description" content="Mirror Cartographer wordless sky-state interface." />
    <title>Mirror Cartographer</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #050510; overflow: hidden; }
      .boot-failsafe {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 62%, rgba(255,226,191,.24), transparent 22%),
          radial-gradient(circle at 18% 16%, rgba(125,211,252,.18), transparent 36%),
          radial-gradient(circle at 82% 12%, rgba(240,171,252,.16), transparent 32%),
          linear-gradient(180deg, #060718, #10162b 46%, #07070d);
      }
      .boot-failsafe i {
        width: min(34vw, 170px);
        aspect-ratio: 1;
        border: 2px solid rgba(255,226,191,.74);
        border-radius: 50%;
        box-shadow: 0 0 44px rgba(255,190,116,.42), inset 0 0 36px rgba(255,226,191,.18);
        animation: breathe 2.8s ease-in-out infinite;
      }
      @keyframes breathe { 50% { transform: scale(1.13); opacity: .68; } }

      .comet-companion,
      .comet-spark,
      .comet-bloom { position: fixed; pointer-events: none; z-index: 2147483647; }
      .comet-companion {
        left: 0;
        top: 0;
        width: 34px;
        height: 31px;
        opacity: 0;
        transform: translate3d(-50px,-50px,0);
        transition: opacity .18s ease, filter .12s ease;
        clip-path: polygon(5% 0, 31% 16%, 50% 10%, 69% 16%, 95% 0, 88% 35%, 96% 58%, 86% 87%, 67% 100%, 33% 100%, 14% 87%, 4% 58%, 12% 35%);
        background:
          radial-gradient(circle at 35% 48%, #382e59 0 1.7px, transparent 2px),
          radial-gradient(circle at 65% 48%, #382e59 0 1.7px, transparent 2px),
          radial-gradient(ellipse at 50% 64%, #d88cae 0 2px, transparent 2.4px),
          radial-gradient(circle at 31% 68%, rgba(255,151,187,.72) 0 3.2px, transparent 3.6px),
          radial-gradient(circle at 69% 68%, rgba(255,151,187,.72) 0 3.2px, transparent 3.6px),
          linear-gradient(145deg, #fffdf5 0%, #ffe2bf 42%, #c4b5fd 76%, #7dd3fc 100%);
        border: 1px solid rgba(255,255,255,.78);
        filter: drop-shadow(0 0 7px rgba(255,190,116,.95)) drop-shadow(0 0 17px rgba(196,181,253,.62));
        will-change: transform;
      }
      .comet-companion::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 20px;
        width: 20px;
        height: 8px;
        background:
          linear-gradient(8deg, transparent 46%, rgba(255,248,239,.9) 48% 52%, transparent 54%) left top / 9px 4px no-repeat,
          linear-gradient(-8deg, transparent 46%, rgba(255,248,239,.9) 48% 52%, transparent 54%) right top / 9px 4px no-repeat,
          linear-gradient(-8deg, transparent 46%, rgba(255,248,239,.9) 48% 52%, transparent 54%) left bottom / 9px 4px no-repeat,
          linear-gradient(8deg, transparent 46%, rgba(255,248,239,.9) 48% 52%, transparent 54%) right bottom / 9px 4px no-repeat;
        opacity: .9;
      }
      .comet-companion::after {
        content: "✦";
        position: absolute;
        right: 2px;
        top: 1px;
        color: #fff8ef;
        font-size: 8px;
        text-shadow: 0 0 7px #ffbe74;
        animation: comet-twinkle 1.2s ease-in-out infinite alternate;
      }
      .comet-companion.is-down {
        filter: drop-shadow(0 0 12px rgba(255,190,116,1)) drop-shadow(0 0 24px rgba(196,181,253,.9));
      }
      .comet-spark {
        width: 5px;
        height: 5px;
        margin: -2.5px 0 0 -2.5px;
        border-radius: 50%;
        background: #fff8ef;
        box-shadow: 0 0 7px #ffbe74, 0 0 14px #c4b5fd;
        animation: comet-drift .72s ease-out forwards;
      }
      .comet-bloom {
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border: 1px solid rgba(255,226,191,.9);
        border-radius: 50%;
        box-shadow: 0 0 12px rgba(255,190,116,.9), inset 0 0 8px rgba(196,181,253,.65);
        animation: comet-bloom .9s cubic-bezier(.16,.8,.24,1) forwards;
      }
      .comet-bloom::before,
      .comet-bloom::after {
        content: "✦";
        position: absolute;
        left: 50%;
        top: 50%;
        color: #fff8ef;
        text-shadow: 0 0 9px #7dd3fc;
      }
      .comet-bloom::before { transform: translate(-50%,-50%) rotate(18deg); }
      .comet-bloom::after { transform: translate(-50%,-50%) rotate(63deg) scale(.65); }
      @keyframes comet-twinkle { to { transform: rotate(22deg) scale(1.35); opacity: .68; } }
      @keyframes comet-drift {
        to { transform: translate(var(--dx),var(--dy)) scale(.15) rotate(90deg); opacity: 0; }
      }
      @keyframes comet-bloom {
        70% { opacity: .9; }
        to { transform: scale(8) rotate(35deg); opacity: 0; }
      }
      @media (pointer:fine) {
        html, body, button, a, [role="button"] { cursor: none !important; }
      }
      @media (pointer:coarse) {
        .comet-companion, .comet-spark { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .comet-companion::after { animation: none; }
        .comet-spark { display: none; }
        .comet-bloom { animation-duration: .01ms; }
      }
    </style>
  </head>
  <body>
    <div id="root"><main class="boot-failsafe" aria-label="Loading"><i aria-hidden="true"></i></main></div>
    <div class="comet-companion" aria-hidden="true"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        const companion = document.querySelector('.comet-companion');
        const finePointer = window.matchMedia('(pointer:fine)').matches;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let x = -50;
        let y = -50;
        let tx = -50;
        let ty = -50;
        let lastSpark = 0;
        let frame = 0;

        const bloom = (clientX, clientY) => {
          const node = document.createElement('i');
          node.className = 'comet-bloom';
          node.style.left = `${clientX}px`;
          node.style.top = `${clientY}px`;
          document.body.appendChild(node);
          node.addEventListener('animationend', () => node.remove(), { once: true });
        };

        const spark = (clientX, clientY) => {
          if (reducedMotion) return;
          const node = document.createElement('i');
          node.className = 'comet-spark';
          node.style.left = `${clientX}px`;
          node.style.top = `${clientY}px`;
          node.style.setProperty('--dx', `${(Math.random() - .5) * 24}px`);
          node.style.setProperty('--dy', `${10 + Math.random() * 22}px`);
          document.body.appendChild(node);
          node.addEventListener('animationend', () => node.remove(), { once: true });
        };

        const animate = () => {
          x += (tx - x) * .34;
          y += (ty - y) * .34;
          companion.style.transform = `translate3d(${x - 17}px,${y - 15}px,0)`;
          frame = requestAnimationFrame(animate);
        };

        if (finePointer) {
          frame = requestAnimationFrame(animate);
          window.addEventListener('pointermove', (event) => {
            tx = event.clientX;
            ty = event.clientY;
            companion.style.opacity = '1';
            const now = performance.now();
            if (now - lastSpark > 42) {
              lastSpark = now;
              spark(event.clientX - 5, event.clientY + 8);
            }
          }, { passive: true });
          window.addEventListener('pointerleave', () => { companion.style.opacity = '0'; });
          window.addEventListener('pointerdown', (event) => {
            companion.classList.add('is-down');
            bloom(event.clientX, event.clientY);
          }, { passive: true });
          window.addEventListener('pointerup', () => companion.classList.remove('is-down'), { passive: true });
        } else {
          window.addEventListener('pointerdown', (event) => bloom(event.clientX, event.clientY), { passive: true });
        }

        window.addEventListener('pagehide', () => cancelAnimationFrame(frame), { once: true });
      })();
    </script>
  </body>
</html>
