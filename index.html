<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#03040a" />
  <meta name="description" content="A private playable portal for art, music, weather, fragments, and aftermath." />
  <title>Mirror Portal</title>
</head>
<body>
  <a class="source-autobiography-link" href="/source-autobiography.html">source autobiography room</a>
  <div id="root"></div>
  <script>
    try {
      const feedVersion = 'portal-feed-2026-04-26-episode-003-ocean-static-radio';
      const versionKey = 'mirror.portal.feed.version';
      const stateKey = 'mirror.portal.creation.weather.v1';
      if (window.localStorage && window.localStorage.getItem(versionKey) !== feedVersion) {
        window.localStorage.removeItem(stateKey);
        window.localStorage.setItem(versionKey, feedVersion);
      }
    } catch (error) {
      console.warn('Mirror Portal feed-version guard skipped:', error);
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
