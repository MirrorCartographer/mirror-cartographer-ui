<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05040a" />
    <meta
      name="description"
      content="A rigorous FIV cure and vaccine proof map: what is proven, what is plausible, what remains unproven, and the translational roadmap required for feline immunodeficiency virus."
    />
    <title>FIV Cure + Vaccine Proof Map — Mirror Cartographer</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #05040a; }
      .boot-failsafe {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #fff7ef;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 20% 10%, rgba(255,95,150,.18), transparent 34%), radial-gradient(circle at 80% 20%, rgba(87,220,255,.14), transparent 32%), #05040a;
      }
      .boot-failsafe article {
        max-width: 720px;
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 28px;
        padding: 28px;
        background: rgba(255,255,255,.055);
        box-shadow: 0 24px 80px rgba(0,0,0,.35);
      }
      .boot-failsafe h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 4.4rem); line-height: .9; letter-spacing: -.07em; }
      .boot-failsafe p { color: #d9d0de; line-height: 1.55; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-failsafe">
        <article>
          <h1>FIV cure and vaccine proof map is loading.</h1>
          <p>If this message stays visible, the React bundle did not mount. Check the Vercel build output for the latest commit and confirm the project builds from this repository root with <strong>npm run build</strong>.</p>
        </article>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
