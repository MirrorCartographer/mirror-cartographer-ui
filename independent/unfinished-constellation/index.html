<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080910" />
  <title>Unfinished Constellation</title>
  <style>
    :root { color-scheme:dark; --night:#080910; --paper:#f0eadf; --dim:#9ca0b4; --line:rgba(240,234,223,.24); --pulse:#c9d7ff; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--night); color:var(--paper); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    body { min-height:100svh; overflow:hidden; }
    button { font:inherit; color:inherit; }
    .stage { position:relative; min-height:100svh; display:grid; place-items:center; isolation:isolate; }
    canvas { position:absolute; inset:0; width:100%; height:100%; z-index:-2; }
    .veil { position:absolute; inset:0; z-index:-1; pointer-events:none; background:radial-gradient(circle at 50% 50%,transparent 0 36%,rgba(8,9,16,.58) 74%,rgba(8,9,16,.96)); }
    main { width:min(90vw,740px); text-align:center; padding:clamp(1.25rem,4vw,3rem); }
    .eyebrow { color:var(--dim); text-transform:uppercase; letter-spacing:.24em; font-size:.72rem; }
    h1 { margin:.8rem 0 1rem; font-family:Georgia,'Times New Roman',serif; font-weight:400; font-size:clamp(3rem,10vw,7.2rem); line-height:.84; letter-spacing:-.06em; text-wrap:balance; }
    .premise { max-width:37rem; margin:0 auto; color:var(--dim); line-height:1.65; font-size:clamp(.95rem,2.4vw,1.1rem); }
    .console { margin:clamp(2rem,7vh,4.5rem) auto 0; display:grid; gap:.85rem; justify-items:center; }
    .phrase { min-height:3.6rem; max-width:35rem; font-family:Georgia,'Times New Roman',serif; font-size:clamp(1.15rem,3.2vw,1.6rem); line-height:1.45; }
    .controls { display:flex; flex-wrap:wrap; justify-content:center; gap:.65rem; }
    .control { min-height:44px; border:1px solid var(--line); background:rgba(8,9,16,.66); padding:.65rem .9rem; cursor:pointer; touch-action:manipulation; backdrop-filter:blur(10px); }
    .control:hover,.control:focus-visible { border-color:var(--paper); outline:none; }
    .meter { position:fixed; left:max(1rem,env(safe-area-inset-left)); bottom:max(1rem,env(safe-area-inset-bottom)); color:var(--dim); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; }
    @media (prefers-reduced-motion:reduce) { .control { transition:none; } }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="veil" aria-hidden="true"></div>
    <main>
      <div class="eyebrow">A machine for almost-patterns</div>
      <h1>Unfinished<br />Constellation</h1>
      <p class="premise">Every point is certain. The shape between them is allowed to keep changing.</p>
      <section class="console" aria-label="Constellation controls">
        <p class="phrase" id="phrase" role="status" aria-live="polite">Touch the field once. It will remember only the distance between now and then.</p>
        <div class="controls">
          <button class="control" id="shift" type="button">Shift the pattern</button>
          <button class="control" id="hold" type="button" aria-pressed="false">Hold: off</button>
          <button class="control" id="clear" type="button">Clear</button>
        </div>
      </section>
    </main>
    <div class="meter" id="meter" aria-hidden="true">0 points · drifting</div>
  </div>
<script>
(() => {
  'use strict';
  const lines = [
    'A shape can be accurate without being finished.',
    'Two distant points agree to share a temporary edge.',
    'The missing star is doing structural work.',
    'The pattern changes because the viewer has moved.',
    'Nothing here is random; it is merely not obligated to repeat.',
    'The sky keeps one fact and releases the explanation.',
    'A line appears, then declines to become a border.',
    'The constellation is complete only from somewhere else.'
  ];
  const canvas = document.querySelector('#sky');
  const ctx = canvas.getContext('2d');
  const phrase = document.querySelector('#phrase');
  const meter = document.querySelector('#meter');
  const shift = document.querySelector('#shift');
  const hold = document.querySelector('#hold');
  const clear = document.querySelector('#clear');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let points = [];
  let phase = 0;
  let held = false;
  let raf = 0;

  function seed(count = 11) {
    const w = innerWidth, h = innerHeight;
    points = Array.from({ length:count }, (_, i) => ({
      x: w * (.12 + ((i * 47) % 77) / 100),
      y: h * (.12 + ((i * 61) % 73) / 100),
      dx: ((i % 3) - 1) * .045,
      dy: (((i + 1) % 3) - 1) * .035
    }));
    updateMeter();
  }

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if (!points.length) seed();
    if (reduced) draw();
  }

  function updateMeter() {
    meter.textContent = `${points.length} points · ${held ? 'held' : 'drifting'}`;
  }

  function draw() {
    const w = innerWidth, h = innerHeight;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#080910'; ctx.fillRect(0,0,w,h);
    if (!held && !reduced) {
      phase += .003;
      for (const p of points) {
        p.x += p.dx + Math.sin(phase + p.y * .01) * .018;
        p.y += p.dy + Math.cos(phase + p.x * .01) * .014;
        if (p.x < 20 || p.x > w - 20) p.dx *= -1;
        if (p.y < 20 || p.y > h - 20) p.dy *= -1;
      }
    }
    ctx.lineWidth = 1;
    for (let i=0;i<points.length;i++) {
      for (let j=i+1;j<points.length;j++) {
        const a = points[i], b = points[j];
        const d = Math.hypot(a.x-b.x,a.y-b.y);
        if (d < Math.min(w,h) * .24) {
          ctx.strokeStyle = `rgba(201,215,255,${Math.max(0,.2-d/900)})`;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }
    for (const p of points) {
      ctx.fillStyle = '#f0eadf';
      ctx.beginPath(); ctx.arc(p.x,p.y,1.8,0,Math.PI*2); ctx.fill();
    }
    if (!reduced) raf = requestAnimationFrame(draw);
  }

  function transformPattern() {
    phase += .77;
    points.forEach((p,i) => {
      p.dx = Math.sin(phase + i) * .055;
      p.dy = Math.cos(phase * .7 + i) * .045;
    });
    phrase.textContent = lines[Math.floor((phase * 10) % lines.length)];
    if (reduced) draw();
  }

  canvas.addEventListener('pointerdown', event => {
    points.push({ x:event.clientX, y:event.clientY, dx:Math.sin(points.length)*.05, dy:Math.cos(points.length)*.04 });
    phrase.textContent = lines[points.length % lines.length];
    updateMeter();
    if (reduced) draw();
  });
  shift.addEventListener('click', transformPattern);
  hold.addEventListener('click', () => {
    held = !held;
    hold.setAttribute('aria-pressed', String(held));
    hold.textContent = `Hold: ${held ? 'on' : 'off'}`;
    updateMeter();
  });
  clear.addEventListener('click', () => {
    points = [];
    phrase.textContent = 'The field is empty, but the coordinate system remains.';
    updateMeter();
    if (reduced) draw();
  });
  addEventListener('resize', resize, { passive:true });
  resize();
  if (!reduced) raf = requestAnimationFrame(draw);
  addEventListener('pagehide', () => cancelAnimationFrame(raf), { once:true });
})();
</script>
</body>
</html>
