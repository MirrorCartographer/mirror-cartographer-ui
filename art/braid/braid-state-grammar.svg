<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Braided steward state grammar</title>
  <desc id="desc">An editable diagram showing Research, Resources, Art, Build, and Integration around a shared control plane, with labeled state glyphs that do not depend on color alone.</desc>
  <defs>
    <style>
      :root{--bg:#0d1020;--panel:#171a2d;--ink:#f4efe4;--muted:#b9b3c9;--line:#7d7890;--accent:#d6b56e;--focus:#ffffff}
      .bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.label{fill:var(--ink);font:600 22px system-ui,sans-serif}.small{fill:var(--muted);font:16px system-ui,sans-serif}.edge{fill:none;stroke:var(--line);stroke-width:4}.edge[data-state="running"]{stroke-dasharray:14 8}.node{fill:var(--panel);stroke:var(--accent);stroke-width:3}.glyph{fill:none;stroke:var(--ink);stroke-width:3}.focus{fill:none;stroke:var(--focus);stroke-width:4;stroke-dasharray:6 6}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7d7890"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <rect class="panel" x="360" y="265" width="480" height="190" rx="24"/>
  <text class="label" x="600" y="330" text-anchor="middle">BRAID CONTROL PLANE</text>
  <text class="small" x="600" y="365" text-anchor="middle">queue · lease · handoff · receipt</text>
  <g id="research" transform="translate(110 105)"><circle class="node" cx="100" cy="80" r="72"/><path class="glyph" d="M70 80h60M100 50v60"/><text class="label" x="100" y="180" text-anchor="middle">Research</text></g>
  <g id="resources" transform="translate(890 105)"><circle class="node" cx="100" cy="80" r="72"/><path class="glyph" d="M68 60h64v40H68zM82 48h36"/><text class="label" x="100" y="180" text-anchor="middle">Resources</text></g>
  <g id="art" transform="translate(70 470)"><circle class="node" cx="100" cy="80" r="72"/><path class="glyph" d="M65 105 96 48l39 57z"/><text class="label" x="100" y="180" text-anchor="middle">Art</text></g>
  <g id="build" transform="translate(930 470)"><circle class="node" cx="100" cy="80" r="72"/><path class="glyph" d="M66 55h68v50H66zM82 42v13M118 42v13"/><text class="label" x="100" y="180" text-anchor="middle">Build</text></g>
  <g id="integration" transform="translate(500 500)"><circle class="node" cx="100" cy="80" r="72"/><path class="glyph" d="M65 80h70M100 45v70M76 56l48 48M124 56l-48 48"/><text class="label" x="100" y="180" text-anchor="middle">Integration</text></g>
  <path class="edge" marker-end="url(#arrow)" d="M282 190C390 215 415 255 455 300"/>
  <path class="edge" marker-end="url(#arrow)" d="M918 190C810 215 785 255 745 300"/>
  <path class="edge" marker-end="url(#arrow)" d="M242 520C340 470 400 435 465 410"/>
  <path class="edge" marker-end="url(#arrow)" d="M958 520C860 470 800 435 735 410"/>
  <path class="edge" marker-end="url(#arrow)" data-state="running" d="M600 455v45"/>
  <g id="legend" transform="translate(380 45)">
    <rect class="panel" width="440" height="135" rx="18"/>
    <text class="label" x="24" y="34">State grammar</text>
    <circle class="glyph" cx="36" cy="70" r="10"/><text class="small" x="56" y="76">queued</text>
    <rect class="glyph" x="150" y="60" width="20" height="20"/><text class="small" x="180" y="76">leased</text>
    <path class="glyph" d="M280 60v20l18-10z"/><text class="small" x="310" y="76">running</text>
    <path class="glyph" d="M26 103h20M36 93v20"/><text class="small" x="56" y="109">repair</text>
    <path class="glyph" d="m150 103 8 8 16-20"/><text class="small" x="180" y="109">accepted</text>
    <path class="glyph" d="m280 94 18 18m0-18-18 18"/><text class="small" x="310" y="109">blocked</text>
  </g>
</svg>