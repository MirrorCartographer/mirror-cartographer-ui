name: Vercel Repertory OIDC Receipt

on:
  workflow_dispatch:
    inputs:
      audience:
        description: Expected GitHub OIDC audience
        required: true
        default: mirror-cartographer-vercel-repertory
        type: string
      observed_at_epoch:
        description: Observation epoch bound into the receipt
        required: true
        type: string
      challenge_receipt_sha256:
        description: SHA-256 of retained challenge receipt
        required: true
        type: string
      capability_transcript_sha256:
        description: SHA-256 of retained capability transcript
        required: true
        type: string
      hostname_transcript_sha256:
        description: SHA-256 of retained hostname transcript
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  RECEIPT_DIR: operations/runtime-evidence/vercel-repertory-oidc

jobs:
  verify-and-bind:
    name: Verify GitHub OIDC and retain token-free receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify existing OIDC and repertory gates
        run: |
          node --test operations/frontier-research/githubOidcReceiptPipeline.v1.test.cjs
          node --test operations/frontier-research/githubActionsOidcReceiptAdapter.v1.test.cjs
          node --test operations/vercel-studio/repertory/assessOidcBoundRepertoryPublicationReadiness.v1.test.cjs

      - name: Validate digest inputs and create expected binding
        env:
          AUDIENCE: ${{ inputs.audience }}
          OBSERVED_AT_EPOCH: ${{ inputs.observed_at_epoch }}
          CHALLENGE_DIGEST: ${{ inputs.challenge_receipt_sha256 }}
          CAPABILITY_DIGEST: ${{ inputs.capability_transcript_sha256 }}
          HOSTNAME_DIGEST: ${{ inputs.hostname_transcript_sha256 }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const digests = {
            challenge_receipt_sha256: process.env.CHALLENGE_DIGEST,
            capability_transcript_sha256: process.env.CAPABILITY_DIGEST,
            hostname_transcript_sha256: process.env.HOSTNAME_DIGEST,
          };
          for (const [name, value] of Object.entries(digests)) {
            if (!/^[a-f0-9]{64}$/.test(value || '')) throw new Error(`invalid ${name}`);
          }
          const observed = Number(process.env.OBSERVED_AT_EPOCH);
          if (!Number.isSafeInteger(observed) || observed <= 0) throw new Error('invalid observed_at_epoch');
          if (!process.env.AUDIENCE) throw new Error('missing audience');
          fs.mkdirSync(process.env.RECEIPT_DIR, { recursive: true });
          fs.writeFileSync(path.join(process.env.RECEIPT_DIR, 'expected.json'), JSON.stringify({
            audience: process.env.AUDIENCE,
            observed_at_epoch: observed,
            transcript_digests: digests,
          }, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          NODE

      - name: Request, verify, and bind GitHub OIDC token in process memory
        run: |
          node <<'NODE'
          const path = require('node:path');
          const {
            runGitHubActionsOidcReceiptAdapter,
            writeReceiptNoOverwrite,
          } = require('./operations/frontier-research/githubActionsOidcReceiptAdapter.v1.cjs');
          (async () => {
            const result = await runGitHubActionsOidcReceiptAdapter({
              expected_path: path.join(process.env.RECEIPT_DIR, 'expected.json'),
            });
            if (!result.verified) {
              console.error(JSON.stringify({ verified: false, violations: result.violations }));
              process.exitCode = 1;
              return;
            }
            writeReceiptNoOverwrite(path.join(process.env.RECEIPT_DIR, 'verified-receipt.json'), result);
            console.log(JSON.stringify({
              verified: true,
              repository: result.receipt.repository,
              workflow_sha: result.receipt.workflow_sha,
              run_id: result.receipt.run_id,
              run_attempt: result.receipt.run_attempt,
              token_retained: result.token_retained,
              authorization_retained: result.authorization_retained,
            }));
          })().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Remove request-only expected binding
        if: always()
        run: rm -f "$RECEIPT_DIR/expected.json"

      - name: Upload verified token-free receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-repertory-oidc-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPT_DIR }}/verified-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish claim boundary
        if: always()
        run: |
          {
            echo '## Vercel repertory OIDC receipt'
            echo '- This workflow does not deploy or activate the repertory.'
            echo '- The bearer token and request authorization are not retained.'
            echo '- Success proves only GitHub OIDC signature/claim verification and exact-run transcript-digest binding.'
            echo '- Deployment identity, browser rendering, audio audibility, process integrity, hardware attestation, and transcript-content truth remain unproven.'
          } >> "$GITHUB_STEP_SUMMARY"
