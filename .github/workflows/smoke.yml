name: Smoke Test

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  phone-first-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify every HTML file is indexed
        run: node tools/validate-workbench-index.mjs public/workbench.html workbench.html

      - name: Install Playwright Chromium
        run: npx playwright install --only-shell chromium

      - name: Run local phone-first gate
        run: npm run test:local-gate && npm run test:rooms

      - name: Run live GitHub Pages gate after manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          SITE_URL: https://mirrorcartographer.github.io/mirror-cartographer-ui/
        run: npm run test:remote-gate

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
