name: Backup, restore, and disaster-recovery contract

on:
  push:
    paths:
      - "platform/backup/**"
      - ".github/workflows/backup-contract.yml"
  pull_request:
    paths:
      - "platform/backup/**"
      - ".github/workflows/backup-contract.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node platform/backup/verify-backup-contract.mjs platform/backup/policy.json platform/backup/inventory.json platform/backup/restore-graph.json
      - run: node platform/backup/test.mjs
