name: Vercel Studio Audio Routing Evidence

on:
  push:
    branches: [main]
    paths:
      - 'src/engine/audioRoutingEvidenceRuntime.js'
      - 'tests/audio-routing-sticky.spec.js'
      - 'scripts/audio-routing-evidence-contract-check.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vercel-studio-audio-routing.yml'
  pull_request:
    paths:
      - 'src/engine/audioRoutingEvidenceRuntime.js'
      - 'tests/audio-routing-sticky.spec.js'
      - 'scripts/audio-routing-evidence-contract-check.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vercel-studio-audio-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-studio-audio-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-audio-routing-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        id: dependencies
        run: npm ci

      - name: Install Playwright Chromium
        id: browser
        run: npx playwright install --with-deps chromium

      - name: Run isolated audio-routing contract
        id: contract
        run: npm run test:audio-routing

      - name: Run browser sticky-routing regression
        id: regression
        run: npm run test:audio-routing-browser

      - name: Build production bundle
        id: build
        run: npm run build

      - name: Record commit-bound evidence
        if: always()
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          BROWSER_INSTALL_OUTCOME: ${{ steps.browser.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p test-results/evidence
          node <<'NODE'
          const fs = require('node:fs');
          const outcomes = {
            dependencies: process.env.DEPENDENCIES_OUTCOME || 'not-run',
            browser_install: process.env.BROWSER_INSTALL_OUTCOME || 'not-run',
            source_contract: process.env.CONTRACT_OUTCOME || 'not-run',
            browser_regression: process.env.REGRESSION_OUTCOME || 'not-run',
            production_build: process.env.BUILD_OUTCOME || 'not-run',
          };
          const required = ['source_contract', 'browser_regression', 'production_build'];
          const verificationPassed = required.every((key) => outcomes[key] === 'success');
          const evidence = {
            schema_version: 2,
            queue_item: 'V-001',
            repository: process.env.GITHUB_REPOSITORY,
            commit_sha: process.env.GITHUB_SHA,
            workflow: process.env.GITHUB_WORKFLOW,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: process.env.GITHUB_REF,
            outcomes,
            verification_passed: verificationPassed,
            evidence_scope: 'source contract, browser regression, and production build; not physical speaker emission or Vercel deployment',
            generated_at_utc: new Date().toISOString(),
          };
          fs.writeFileSync(
            'test-results/evidence/vercel-studio-audio-routing.json',
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          NODE

      - name: Upload evidence and Playwright output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-studio-audio-routing-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 30
