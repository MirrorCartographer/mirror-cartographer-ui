name: deployment-contract
on:
  pull_request:
    paths:
      - 'platform/deployment/**'
      - '.github/workflows/deployment-contract.yml'
  push:
    branches: [preview]
    paths:
      - 'platform/deployment/**'
      - '.github/workflows/deployment-contract.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node platform/deployment/verify-deployment-contract.mjs
      - run: node platform/deployment/test.mjs
