name: CI worker sovereignty contract

on:
  pull_request:
    paths:
      - 'platform/ci/**'
      - '.github/workflows/ci-worker-contract.yml'
  push:
    branches: [main]
    paths:
      - 'platform/ci/**'
      - '.github/workflows/ci-worker-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node platform/ci/verify-ci-contract.mjs platform/ci/policy.json platform/ci/inventory.json
      - run: node platform/ci/test.mjs
