name: Vercel retained evidence contract

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vercel-retained-evidence-contract.yml'
      - 'tools/vercel-studio/retained-workflow-evidence-cli.mjs'
      - 'tools/vercel-studio/retained-workflow-evidence-cli.test.mjs'
      - 'tools/vercel-studio/gh-envelope-bundle-adapter.mjs'
      - 'tools/vercel-studio/gh-envelope-bundle-adapter.test.mjs'
      - 'tools/vercel-studio/workflow-evidence-bundle.mjs'
      - 'tools/vercel-studio/workflow-evidence-bundle.test.mjs'
      - 'tools/vercel-studio/retained-workflow-trigger-gate.mjs'
      - 'tools/vercel-studio/retained-workflow-trigger-gate.test.mjs'
      - 'tools/frontier-research/workflow-trigger-expectation.mjs'
      - 'tools/frontier-research/workflow-trigger-expectation.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/vercel-retained-evidence-contract.yml'
      - 'tools/vercel-studio/retained-workflow-evidence-cli.mjs'
      - 'tools/vercel-studio/retained-workflow-evidence-cli.test.mjs'
      - 'tools/vercel-studio/gh-envelope-bundle-adapter.mjs'
      - 'tools/vercel-studio/gh-envelope-bundle-adapter.test.mjs'
      - 'tools/vercel-studio/workflow-evidence-bundle.mjs'
      - 'tools/vercel-studio/workflow-evidence-bundle.test.mjs'
      - 'tools/vercel-studio/retained-workflow-trigger-gate.mjs'
      - 'tools/vercel-studio/retained-workflow-trigger-gate.test.mjs'
      - 'tools/frontier-research/workflow-trigger-expectation.mjs'
      - 'tools/frontier-research/workflow-trigger-expectation.test.mjs'

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  TEST_LOG_DIR: vercel-retained-evidence-test-logs

jobs:
  retained-evidence-contract:
    name: Retained evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Verify immutable action references
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            reference="${line##*@}"
            reference="${reference%% *}"
            if [[ ! "${reference}" =~ ^[0-9a-f]{40}$ ]]; then
              printf 'Mutable action reference rejected: %s\n' "${line}" >&2
              exit 1
            fi
          done < <(grep -E '^[[:space:]]+uses:[[:space:]]+[^[:space:]]+@' .github/workflows/vercel-retained-evidence-contract.yml)

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prepare retained test transcript directory
        run: mkdir -p "${TEST_LOG_DIR}"

      - name: Verify retained evidence CLI and provenance boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/vercel-studio/retained-workflow-evidence-cli.test.mjs \
            2>&1 | tee "${TEST_LOG_DIR}/retained-workflow-evidence-cli.tap"

      - name: Verify gh envelope adapter
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/vercel-studio/gh-envelope-bundle-adapter.test.mjs \
            2>&1 | tee "${TEST_LOG_DIR}/gh-envelope-bundle-adapter.tap"

      - name: Verify tamper-evident workflow bundle
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/vercel-studio/workflow-evidence-bundle.test.mjs \
            2>&1 | tee "${TEST_LOG_DIR}/workflow-evidence-bundle.tap"

      - name: Verify trigger expectation contract
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/frontier-research/workflow-trigger-expectation.test.mjs \
            2>&1 | tee "${TEST_LOG_DIR}/workflow-trigger-expectation.tap"

      - name: Verify retained workflow trigger gate
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/vercel-studio/retained-workflow-trigger-gate.test.mjs \
            2>&1 | tee "${TEST_LOG_DIR}/retained-workflow-trigger-gate.tap"

      - name: Record exact tested sources
        run: |
          printf '%s\n' "${GITHUB_SHA}" > vercel-retained-evidence-tested-commit.txt
          test "$(cat vercel-retained-evidence-tested-commit.txt)" = "${GITHUB_SHA}"
          sha256sum \
            .github/workflows/vercel-retained-evidence-contract.yml \
            tools/vercel-studio/retained-workflow-evidence-cli.mjs \
            tools/vercel-studio/retained-workflow-evidence-cli.test.mjs \
            tools/vercel-studio/gh-envelope-bundle-adapter.mjs \
            tools/vercel-studio/gh-envelope-bundle-adapter.test.mjs \
            tools/vercel-studio/workflow-evidence-bundle.mjs \
            tools/vercel-studio/workflow-evidence-bundle.test.mjs \
            tools/vercel-studio/retained-workflow-trigger-gate.mjs \
            tools/vercel-studio/retained-workflow-trigger-gate.test.mjs \
            tools/frontier-research/workflow-trigger-expectation.mjs \
            tools/frontier-research/workflow-trigger-expectation.test.mjs \
            > vercel-retained-evidence-tested-sources.sha256
          test "$(wc -l < vercel-retained-evidence-tested-sources.sha256)" -eq 11
          sha256sum --check vercel-retained-evidence-tested-sources.sha256

      - name: Record retained test transcript digests
        run: |
          test "$(find "${TEST_LOG_DIR}" -maxdepth 1 -type f -name '*.tap' | wc -l)" -eq 5
          sha256sum "${TEST_LOG_DIR}"/*.tap > vercel-retained-evidence-test-transcripts.sha256
          test "$(wc -l < vercel-retained-evidence-test-transcripts.sha256)" -eq 5
          sha256sum --check vercel-retained-evidence-test-transcripts.sha256

      - name: Upload commit-bound test record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vercel-retained-evidence-contract-${{ github.sha }}
          path: |
            vercel-retained-evidence-tested-commit.txt
            vercel-retained-evidence-tested-sources.sha256
            vercel-retained-evidence-test-transcripts.sha256
            vercel-retained-evidence-test-logs/*.tap
          if-no-files-found: error
          retention-days: 30
