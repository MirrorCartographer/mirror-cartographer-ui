name: Atlas Source Validation

on:
  push:
    branches: [main]
    paths:
      - 'public/atlas/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate atlas before hosting deployment
        run: |
          test -s public/atlas/index.html
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('public/atlas/index.html', 'utf8');
          const required = [
            '<!doctype html>',
            '<title>Mirror Cartographer',
            'id="filter"',
            'id="experience"',
            'id="art"',
            'id="systems"',
            'id="archive"',
          ];
          const missing = required.filter((token) => !html.includes(token));
          if (missing.length) throw new Error('Missing atlas features: ' + missing.join(', '));
          console.log('PASS: standalone atlas source is ready for Netlify publication.');
          NODE
