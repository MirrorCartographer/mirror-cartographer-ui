name: Atlas Source Validation

on:
  push:
    branches: [main]
    paths:
      - 'public/atlas/**'
      - 'public/research-atlas/**'
      - 'public/self/**'
      - 'research-atlas/**'
      - '.github/workflows/deploy-github-pages.yml'
  pull_request:
    paths:
      - 'public/atlas/**'
      - 'public/research-atlas/**'
      - 'research-atlas/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Living Atlas source
        run: |
          test -s public/atlas/index.html
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { Script } from 'node:vm';
          const html = readFileSync('public/atlas/index.html', 'utf8');
          const required = [
            '<!doctype html>',
            '<title>Mirror Cartographer',
            'id="filter"',
            'id="experience"',
            'id="art"',
            'id="systems"',
            'id="archive"',
            'The Between',
            'research-atlas/',
            'self/',
          ];
          const missing = required.filter((token) => !html.includes(token));
          if (missing.length) throw new Error('Missing Living Atlas features: ' + missing.join(', '));
          const roomWorldLink = [...html.matchAll(/<a\b[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi)]
            .find(([, href, label]) => label.includes('Open the interactive experience'));
          if (!roomWorldLink || roomWorldLink[1] !== '../' || !existsSync('index.html')) {
            throw new Error('Room-World must link to the GitHub Pages app root using ../');
          }
          const forbiddenHostingUrl = /https?:\/\/[^"'<> ]*(?:vercel\.app|netlify\.app|pages\.dev|workers\.dev|cloudflare(?:\.com)?)/i;
          if (forbiddenHostingUrl.test(html)) {
            throw new Error('Living Atlas contains a link to a disallowed hosting provider; use free GitHub Pages.');
          }
          const worldLinks = [...html.matchAll(/href="(\.\/worlds\/[^"]+)"/g)].map(([, href]) => href);
          const missingWorlds = worldLinks.filter((href) => !existsSync(resolve('public/atlas', href)));
          if (!worldLinks.length || missingWorlds.length) {
            throw new Error('Missing local Living Atlas world routes: ' + missingWorlds.join(', '));
          }
          if (!html.includes('href="../research-atlas/"') || !existsSync('public/research-atlas/index.html')) {
            throw new Error('The Between route must resolve to the published research-atlas page.');
          }
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map((match) => match[1]);
          scripts.forEach((script, index) => new Script(script, { filename: 'living-atlas-inline-' + index }));
          if (!html.includes('href="../self/"') || !existsSync('public/self/index.html')) {
            throw new Error('Self Cartographer route must resolve to the published self instrument.');
          }
          console.log('PASS: Living Atlas navigation, Self Cartographer route, and inline JavaScript syntax are valid.');
          NODE

      - name: Validate interactive research atlas
        run: |
          test -s public/research-atlas/index.html
          cmp -s research-atlas/index.html public/research-atlas/index.html
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { Script } from 'node:vm';
          const html = readFileSync('public/research-atlas/index.html', 'utf8');
          const required = [
            '<title>Mirror Cartographer — The Between</title>',
            'data-node="signal"',
            'data-node="context"',
            'data-node="response"',
            'data-node="record"',
            'data-lens="evidence"',
            'data-lens="experience"',
            'data-lens="systems"',
            'data-lens="symbol"',
            'Change one condition',
            'Facts have edges.',
            'va.gov/resources/eligibility-for-community-care-outside-va/',
          ];
          const missing = required.filter((token) => !html.includes(token));
          if (missing.length) throw new Error('Missing research atlas features: ' + missing.join(', '));
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map((match) => match[1]);
          if (!scripts.length) throw new Error('No inline JavaScript found in research atlas.');
          scripts.forEach((script, index) => new Script(script, { filename: 'research-atlas-inline-' + index }));
          console.log('PASS: relationship nodes, reading lenses, counterfactual controls, source links, and JavaScript syntax are valid.');
          NODE
