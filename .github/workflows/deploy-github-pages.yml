name: Atlas Source Validation

on:
  push:
    branches: [main]
    paths:
      - 'public/atlas/**'
      - 'public/research-atlas/**'
      - 'research-atlas/**'
      - '.github/workflows/deploy-github-pages.yml'
  pull_request:
    paths:
      - 'public/atlas/**'
      - 'public/research-atlas/**'
      - 'research-atlas/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Living Atlas source
        run: |
          test -s public/atlas/index.html
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { Script } from 'node:vm';
          const html = readFileSync('public/atlas/index.html', 'utf8');
          const required = [
            '<!doctype html>',
            '<title>Mirror Cartographer',
            'id="filter"',
            'id="experience"',
            'id="art"',
            'id="systems"',
            'id="archive"',
            'The Between',
            'research-atlas/',
          ];
          const missing = required.filter((token) => !html.includes(token));
          if (missing.length) throw new Error('Missing Living Atlas features: ' + missing.join(', '));
          const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map((match) => match[1]);
          scripts.forEach((script, index) => new Script(script, { filename: 'living-atlas-inline-' + index }));
          console.log('PASS: Living Atlas navigation and inline JavaScript syntax are valid.');
          NODE

      - name: Validate interactive research atlas
        run: |
          test -s public/research-atlas/index.html
          cmp -s research-atlas/index.html public/research-atlas/index.html
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { Script } from 'node:vm';
          const html = readFileSync('public/research-atlas/index.html', 'utf8');
          const required = [
            '<title>Mirror Cartographer',
            'data-route="bio"',
            'data-route="access"',
            'data-route="evidence"',
            'data-route="design"',
            'Reveal what this does not establish',
            'Turn the phrase',
            'va.gov/resources/eligibility-for-community-care-outside-va/',
          ];
          const missing = required.filter((token) => !html.includes(token));
          if (missing.length) throw new Error('Missing research atlas features: ' + missing.join(', '));
          const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map((match) => match[1]);
          if (!scripts.length) throw new Error('No inline JavaScript found in research atlas.');
          scripts.forEach((script, index) => new Script(script, { filename: 'research-atlas-inline-' + index }));
          console.log('PASS: routes, uncertainty control, wordplay, source links, and JavaScript syntax are valid.');
          NODE
