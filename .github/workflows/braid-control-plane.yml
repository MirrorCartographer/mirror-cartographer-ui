name: Braid Control Plane

on:
  pull_request:
    paths:
      - '.github/workflows/braid-control-plane.yml'
      - 'automation/steward/**'
      - 'scripts/braid-control-plane-check.mjs'
      - 'scripts/braid-control-plane-check.test.mjs'
      - 'stewards/braid/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: braid-control-plane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-braid:
    name: Validate braid fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run braid control-plane tests
        run: npm run test:braid
