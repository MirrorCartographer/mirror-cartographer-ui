name: Secrets and identity contract
on:
  push:
    paths:
      - "platform/secrets/**"
      - ".github/workflows/secrets-contract.yml"
  pull_request:
    paths:
      - "platform/secrets/**"
      - ".github/workflows/secrets-contract.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node platform/secrets/verify-secrets-contract.mjs platform/secrets/policy.json platform/secrets/inventory.json
      - run: node platform/secrets/test.mjs
