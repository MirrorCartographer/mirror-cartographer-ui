name: Publish interactive application to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mirror-cartographer-ui-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the checked-in Atlas snapshot before regeneration
        run: node scripts/validate-atlas-catalog.mjs

      - name: Generate and validate the current cross-repository Atlas catalog
        run: |
          node --test scripts/atlas-privacy-policy.test.mjs
          node scripts/generate-atlas-catalog.mjs
          node scripts/validate-atlas-catalog.mjs
          node scripts/validate-atlas-routes.mjs
      - name: Install locked dependencies
        run: npm install --no-audit --no-fund
      - name: Verify the inhabited world and visitor interaction contract
        run: npm run test:living-world
      - name: Verify ephemeral perception provenance
        run: npm run test:perception-ledger
      - name: Verify bounded perception-to-resident policy
        run: npm run test:resident-response
      - name: Verify secure resident dialogue and ephemeral conversation context
        run: npm run test:resident-dialogue
      - name: Verify shared-world privacy and RLS contract
        run: npm run test:shared-world-contract
      - name: Verify private and shared world boundaries
        run: npm run test:shared-world
      - name: Build static application for GitHub Pages
        env:
          VITE_DEPLOYMENT_PROVIDER: github-pages
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:pages
      - name: Verify hosted routes and immutable build identity
        run: |
          test -s dist/index.html
          test -s dist/atlas/index.html
          test -s dist/atlas/archive.html
          test -s dist/atlas/rooms/index.html
          test -s dist/atlas/rooms/experiments/001-observatory/index.html
          test -s dist/atlas/rooms/experiments/010-composer/index.html
          test -s dist/atlas/rooms/music/index.html
          test -s dist/atlas/rooms/mind/index.html
          test -s dist/atlas/rooms/chatgpt/index.html
          test -s dist/atlas/rooms/worlds/unreliable-observatory/index.html
          test -s dist/atlas/catalog-index.json
          test -s dist/research-atlas/index.html
          test -s dist/self/index.html
          test -s dist/.well-known/mirror-cartographer-deployment.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const identity = JSON.parse(readFileSync('dist/.well-known/mirror-cartographer-deployment.json', 'utf8'));
          if (identity.application !== 'mirror-cartographer-ui') throw new Error('Unexpected application identity');
          if (identity.commit_sha !== process.env.GITHUB_SHA?.toLowerCase()) throw new Error('Build identity does not match GITHUB_SHA');
          if (identity.deployment_provider !== 'github-pages') throw new Error('Build identity must name github-pages');
          if (identity.claim_scope !== 'build-identity-only') throw new Error('Unexpected identity claim scope');
          console.log('PASS: all hosted routes and GitHub Pages build identity match this commit.');
          NODE
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4