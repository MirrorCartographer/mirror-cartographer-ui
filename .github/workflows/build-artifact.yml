name: Static Preview Artifact

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run local gate
        run: npm run test:gate

      - name: Upload built static site
        uses: actions/upload-artifact@v4
        with:
          name: mirror-cartographer-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright report and traces when present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-cartographer-playwright-output
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
