name: Secrets and workload identity contract

on:
  push:
    paths:
      - "platform/secrets-identity/**"
      - ".github/workflows/secrets-identity-contract.yml"
  pull_request:
    paths:
      - "platform/secrets-identity/**"
      - ".github/workflows/secrets-identity-contract.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node platform/secrets-identity/verify-secrets-identity-contract.mjs platform/secrets-identity/policy.json platform/secrets-identity/inventory.json
      - run: node platform/secrets-identity/test.mjs
