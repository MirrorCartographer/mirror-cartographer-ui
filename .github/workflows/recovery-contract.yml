name: Recovery contract

on:
  pull_request:
    paths:
      - 'platform/recovery/**'
      - '.github/workflows/recovery-contract.yml'
  push:
    branches: [preview]
    paths:
      - 'platform/recovery/**'
      - '.github/workflows/recovery-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node platform/recovery/verify-recovery-contract.mjs
      - run: node platform/recovery/test.mjs
