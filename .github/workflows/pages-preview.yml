name: Atlas Source Checks

on:
  push:
    branches: [main]
    paths:
      - 'public/atlas/**'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate atlas HTML and navigation
        run: |
          test -s public/atlas/index.html
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('public/atlas/index.html', 'utf8');
          const required = [
            '<!doctype html>',
            '<meta name="viewport"',
            '<title>Mirror Cartographer',
            'href="#experience"',
            'href="#art"',
            'href="#systems"',
            'href="#archive"',
            'id="filter"',
            'data-search=',
            'addEventListener',
            'prefers-reduced-motion',
          ];
          const missing = required.filter((token) => !html.includes(token));
          if (missing.length) {
            console.error('Atlas source check failed; missing:', missing.join(', '));
            process.exit(1);
          }
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map((m) => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) {
            console.error('Duplicate HTML IDs:', [...new Set(duplicates)].join(', '));
            process.exit(1);
          }
          console.log('Atlas source checks passed:', required.length, 'requirements; no duplicate IDs.');
          NODE
