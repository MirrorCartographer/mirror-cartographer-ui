name: Atlas Source Checks

on:
  push:
    branches: [main]
    paths:
      - 'public/atlas/**'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML, JavaScript, and source catalog
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('public/atlas/index.html', 'utf8');
          const required = [
            '<!doctype html>',
            '<meta name="viewport"',
            '<title>Mirror Cartographer',
            'href="#experience"',
            'href="#art"',
            'href="#systems"',
            'href="#archive"',
            'id="filter"',
            'id="catalog-results"',
            'catalog-index.json',
            'addEventListener',
            'prefers-reduced-motion',
          ];
          const missing = required.filter((token) => !html.includes(token));
          if (missing.length) throw new Error('Missing HTML requirements: ' + missing.join(', '));
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map((m) => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + [...new Set(duplicates)].join(', '));

          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((m) => m[1]);
          if (scripts.length !== 1) throw new Error('Expected one inline atlas script; found ' + scripts.length);
          new Function(scripts[0]);
          console.log('Inline JavaScript syntax passed.');

          const index = JSON.parse(readFileSync('public/atlas/catalog-index.json', 'utf8'));
          let total = 0;
          for (const source of index.sources) {
            const manifest = JSON.parse(readFileSync('public/atlas/' + source.file, 'utf8'));
            if (manifest.repository !== source.repo) throw new Error('Repository mismatch for ' + source.file);
            if (manifest.items.length !== source.file_count) throw new Error('File count mismatch for ' + source.file);
            if (!/^[0-9a-f]{40}$/i.test(manifest.tree_sha)) throw new Error('Invalid tree SHA for ' + source.file);
            const seen = new Set();
            for (const item of manifest.items) {
              if (!item.path || !/^[0-9a-f]{40}$/i.test(item.sha)) throw new Error('Invalid catalog item in ' + source.file);
              if (seen.has(item.path)) throw new Error('Duplicate path in ' + source.file + ': ' + item.path);
              seen.add(item.path);
            }
            total += manifest.items.length;
          }
          if (total !== index.file_count || total < 6000) throw new Error('Catalog total mismatch or unexpectedly small: ' + total);
          console.log(JSON.stringify({
            result: 'PASS',
            htmlChecks: required.length,
            duplicateIds: 0,
            inlineScriptsSyntaxChecked: scripts.length,
            indexedFiles: total,
            sourceRepositories: index.source_count,
          }, null, 2));
          NODE
