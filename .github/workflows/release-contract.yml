name: Release Authority Contract

on:
  pull_request:
    paths:
      - 'platform/release/**'
      - '.github/workflows/release-contract.yml'
  push:
    branches: [preview]
    paths:
      - 'platform/release/**'
      - '.github/workflows/release-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout admitted source
        uses: actions/checkout@v4
      - name: Record verifier custody inputs
        run: |
          set -euo pipefail
          node --version
          sha256sum \
            platform/release/policy.json \
            platform/release/verify-release.mjs \
            platform/release/test.mjs
      - name: Run hostile release-authority controls
        run: node platform/release/test.mjs
