name: Time authority contract

on:
  push:
    paths:
      - 'platform/time/**'
      - '.github/workflows/time-authority-contract.yml'
  pull_request:
    paths:
      - 'platform/time/**'
      - '.github/workflows/time-authority-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node platform/time/verify-time-contract.mjs
      - run: node platform/time/test.mjs
