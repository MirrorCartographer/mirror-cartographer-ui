name: identity-secrets-contract
on:
  push:
    branches: [preview]
    paths:
      - 'platform/identity/**'
      - '.github/workflows/identity-secrets-contract.yml'
  pull_request:
    paths:
      - 'platform/identity/**'
      - '.github/workflows/identity-secrets-contract.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node platform/identity/verify-identity-contract.mjs
      - run: node platform/identity/test.mjs
