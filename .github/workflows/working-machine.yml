name: Working Machine Checks

on:
  pull_request:
  push:
    branches:
      - main
      - mc-working-machine-v1

jobs:
  portal-build:
    name: Portal build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build portal
        run: npm run build

  arc-harness-test:
    name: ARC harness tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run ARC harness tests
        run: python -m pytest engines/arc/tests -q
