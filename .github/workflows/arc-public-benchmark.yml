name: ARC Public Benchmark

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'ARC-AGI-2 dataset split to run'
        required: true
        default: 'training'
        type: choice
        options:
          - training
          - evaluation
      limit:
        description: 'Optional maximum number of task files to copy before running. Use 0 for all.'
        required: true
        default: '20'

jobs:
  arc-public-benchmark:
    name: Run ARC public benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out Mirror Cartographer repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone ARC-AGI-2 public data
        run: git clone --depth 1 https://github.com/arcprize/ARC-AGI-2.git /tmp/ARC-AGI-2

      - name: Prepare limited dataset copy
        run: |
          set -euo pipefail
          DATASET="${{ inputs.dataset }}"
          LIMIT="${{ inputs.limit }}"
          SRC="/tmp/ARC-AGI-2/data/${DATASET}"
          DST="/tmp/mc-arc-${DATASET}"
          mkdir -p "$DST"
          if [ "$LIMIT" = "0" ]; then
            cp "$SRC"/*.json "$DST"/
          else
            find "$SRC" -maxdepth 1 -name '*.json' | sort | head -n "$LIMIT" | xargs -I{} cp {} "$DST"/
          fi
          echo "Prepared $(find "$DST" -maxdepth 1 -name '*.json' | wc -l) tasks in $DST"

      - name: Run blinded dual-track solver benchmark
        run: |
          DATASET="${{ inputs.dataset }}"
          python engines/arc/run_public_benchmark.py \
            --data-dir "/tmp/mc-arc-${DATASET}" \
            --out "reports/arc/${DATASET}_benchmark_result.json"

      - name: Print benchmark summary
        run: |
          DATASET="${{ inputs.dataset }}"
          python - <<'PY'
          import json, os
          dataset = os.environ.get('DATASET', '${{ inputs.dataset }}')
          path = f'reports/arc/{dataset}_benchmark_result.json'
          with open(path, 'r', encoding='utf-8') as f:
              result = json.load(f)
          print(json.dumps({
              'dataset': dataset,
              'items_total': result.get('items_total'),
              'attempt1_correct': result.get('attempt1_correct'),
              'attempt2_correct': result.get('attempt2_correct'),
              'pass2_correct': result.get('pass2_correct'),
              'pass2_accuracy': result.get('pass2_accuracy'),
              'convergence_total': result.get('convergence_total'),
              'convergence_accuracy': result.get('convergence_accuracy'),
              'failure_count': result.get('failure_count'),
              'claim_scope': result.get('claim_scope'),
          }, indent=2))
          PY

      - name: Upload benchmark result artifact
        uses: actions/upload-artifact@v4
        with:
          name: arc-${{ inputs.dataset }}-benchmark-result
          path: reports/arc/${{ inputs.dataset }}_benchmark_result.json
