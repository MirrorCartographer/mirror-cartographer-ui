name: Verify Live Living Atlas on Vercel

on:
  push:
    branches: [main]
    paths:
      - 'public/atlas/**'
      - 'vercel.json'
      - '.github/workflows/verify-live-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find working Vercel alias and verify Atlas
        run: |
          node --input-type=module <<'NODE'
          const bases = [
            'https://mirror-cartographer-ui.vercel.app/atlas/',
            'https://mirror-cartographer-ui-3orp.vercel.app/atlas/',
          ];
          const candidates = bases.flatMap((base) => [
            base,
            base.endsWith('/') ? base + 'index.html' : base + '/index.html',
          ]);
          const required = [
            'Mirror Cartographer',
            'The Living Atlas',
            'Experiences',
            'Art, games',
            'Systems with a purpose',
            'The source archive',
            'id="filter"',
          ];
          let lastFailure = 'No request attempted';
          for (let attempt = 1; attempt <= 8; attempt++) {
            for (const url of candidates) {
              try {
                const response = await fetch(url, {
                  redirect: 'follow',
                  cache: 'no-store',
                  signal: AbortSignal.timeout(5000),
                });
                const contentType = response.headers.get('content-type') || '';
                const body = await response.text();
                const missing = required.filter((marker) => !body.includes(marker));
                if (response.ok && contentType.includes('text/html') && missing.length === 0) {
                  const healthUrl = new URL('/atlas/healthz.txt', response.url);
                  const health = await fetch(healthUrl, { cache: 'no-store', signal: AbortSignal.timeout(5000) });
                  const healthBody = await health.text();
                  if (!health.ok || !healthBody.includes('service=mirror-cartographer-living-atlas') || !healthBody.includes('status=ok')) {
                    throw new Error('HTML passed but health probe failed: HTTP ' + health.status + ' at ' + health.url);
                  }
                  console.log(JSON.stringify({
                    result: 'PASS',
                    url: response.url,
                    status: response.status,
                    contentType,
                    htmlMarkersVerified: required.length,
                    healthProbe: health.url,
                    healthStatus: health.status,
                    attempt,
                  }, null, 2));
                  process.exit(0);
                }
                lastFailure = `${url}: HTTP ${response.status}; content-type=${contentType}; missing=${missing.join(', ')}`;
              } catch (error) {
                lastFailure = `${url}: ${String(error)}`;
              }
            }
            console.log(`Attempt ${attempt}/8: ${lastFailure}`);
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }
          throw new Error('No Vercel alias passed the Atlas smoke test: ' + lastFailure);
          NODE
