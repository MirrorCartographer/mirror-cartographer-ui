name: Verify Live Living Atlas on Vercel

on:
  push:
    branches: [main]
    paths:
      - 'public/atlas/**'
      - 'vercel.json'
      - '.github/workflows/verify-live-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Atlas route over HTTPS
        env:
          SITE_URL: https://mirror-cartographer-ui.vercel.app/atlas/
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.SITE_URL;
          const required = [
            'Mirror Cartographer',
            'The Living Atlas',
            'Experiences',
            'Art, games',
            'Systems with a purpose',
            'The source archive',
            'id="filter"',
          ];
          let lastFailure = 'No request attempted';
          for (let attempt = 1; attempt <= 36; attempt++) {
            try {
              const response = await fetch(url, { redirect: 'follow', cache: 'no-store' });
              const contentType = response.headers.get('content-type') || '';
              const body = await response.text();
              const missing = required.filter((marker) => !body.includes(marker));
              if (response.ok && contentType.includes('text/html') && missing.length === 0) {
                console.log(JSON.stringify({
                  result: 'PASS',
                  url: response.url,
                  status: response.status,
                  contentType,
                  markersVerified: required.length,
                  attempt,
                }, null, 2));
                process.exit(0);
              }
              lastFailure = `HTTP ${response.status}; content-type=${contentType}; missing=${missing.join(', ')}`;
            } catch (error) {
              lastFailure = String(error);
            }
            console.log(`Attempt ${attempt}/36: ${lastFailure}`);
            await new Promise((resolve) => setTimeout(resolve, 10000));
          }
          throw new Error('Vercel Atlas route did not pass live smoke test: ' + lastFailure);
          NODE
