name: Verify Live Living Atlas on Vercel

on:
  push:
    branches: [main]
    paths:
      - 'public/atlas/**'
      - 'vercel.json'
      - '.github/workflows/verify-live-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Atlas, local worlds, and health probe
        run: |
          node --input-type=module <<'NODE'
          const bases = [
            'https://mirror-cartographer-ui-3orp.vercel.app/atlas/',
            'https://mirror-cartographer-ui.vercel.app/atlas/',
          ];
          const required = [
            'Mirror Cartographer',
            'The Living Atlas',
            'Worlds you can enter',
            'Night Shift Orchard',
            'Afterimage Orchard',
            'Experiences',
            'Art, games',
            'Systems with a purpose',
            'The source archive',
            'id="filter"',
          ];
          const worldRoutes = [
            '/atlas/worlds/night-shift-orchard.html',
            '/atlas/worlds/afterimage-orchard.html',
            '/atlas/worlds/constellation.html',
            '/atlas/worlds/the-world.html',
            '/atlas/worlds/research-field.html',
            '/atlas/worlds/experiments.html',
          ];
          let lastFailure = 'No request attempted';
          for (let attempt = 1; attempt <= 8; attempt++) {
            for (const url of bases) {
              try {
                const response = await fetch(url, {
                  redirect: 'follow',
                  cache: 'no-store',
                  signal: AbortSignal.timeout(5000),
                });
                const contentType = response.headers.get('content-type') || '';
                const body = await response.text();
                const missing = required.filter((marker) => !body.includes(marker));
                if (!response.ok || !contentType.includes('text/html') || missing.length) {
                  lastFailure = `${url}: HTTP ${response.status}; missing ${missing.join(', ')}`;
                  continue;
                }
                const worldChecks = await Promise.all(worldRoutes.map(async (route) => {
                  const world = await fetch(new URL(route, response.url), {
                    cache: 'no-store',
                    signal: AbortSignal.timeout(5000),
                  });
                  const worldBody = await world.text();
                  return { route, status: world.status, ok: world.ok && /<!doctype html|<html/i.test(worldBody) };
                }));
                const failedWorlds = worldChecks.filter((check) => !check.ok);
                if (failedWorlds.length) {
                  lastFailure = 'Local worlds failed: ' + JSON.stringify(failedWorlds);
                  continue;
                }
                const healthUrl = new URL('/atlas/healthz.txt', response.url);
                const health = await fetch(healthUrl, { cache: 'no-store', signal: AbortSignal.timeout(5000) });
                const healthBody = await health.text();
                if (!health.ok || !healthBody.includes('service=mirror-cartographer-living-atlas') || !healthBody.includes('status=ok')) {
                  lastFailure = 'Health probe failed: HTTP ' + health.status;
                  continue;
                }
                console.log(JSON.stringify({
                  result: 'PASS',
                  url: response.url,
                  status: response.status,
                  contentType,
                  htmlMarkersVerified: required.length,
                  localWorldsVerified: worldChecks.length,
                  healthProbe: health.url,
                  healthStatus: health.status,
                  attempt,
                }, null, 2));
                process.exit(0);
              } catch (error) {
                lastFailure = `${url}: ${String(error)}`;
              }
            }
            console.log(`Attempt ${attempt}/8: ${lastFailure}`);
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }
          throw new Error('Living Atlas smoke test failed: ' + lastFailure);
          NODE
