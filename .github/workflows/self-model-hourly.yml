name: Self-model five-agent hourly cycle
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: self-model-hourly
  cancel-in-progress: false
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library regression tests
        run: python -m unittest discover -s tests/self_model -v
  agent-audit:
    needs: contract-tests
    strategy:
      fail-fast: false
      matrix:
        agent: [research, resources, art, build, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MC_AGENT: ${{ matrix.agent }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate agent contracts and emit role-specific receipt
        run: python tools/self_model/run_cycle.py
      - uses: actions/upload-artifact@v4
        with:
          name: self-model-${{ matrix.agent }}-receipt
          path: self-model-run-receipt-${{ matrix.agent }}.json
          if-no-files-found: error
          retention-days: 14
