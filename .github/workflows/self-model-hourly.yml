name: Self-model hourly audit
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: self-model-hourly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate five-agent contracts and emit receipt
        run: python tools/self_model/run_cycle.py
      - uses: actions/upload-artifact@v4
        with:
          name: self-model-run-receipt
          path: self-model-run-receipt.json
          if-no-files-found: error
          retention-days: 14
