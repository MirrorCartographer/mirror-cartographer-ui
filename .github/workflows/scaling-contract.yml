name: scaling-contract

on:
  push:
    paths:
      - 'platform/scaling/**'
      - '.github/workflows/scaling-contract.yml'
  pull_request:
    paths:
      - 'platform/scaling/**'
      - '.github/workflows/scaling-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node platform/scaling/verify-scaling-contract.mjs
      - run: node platform/scaling/test.mjs
