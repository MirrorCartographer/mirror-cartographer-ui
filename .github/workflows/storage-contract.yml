name: Storage substrate contract

on:
  push:
    paths:
      - "platform/storage/**"
      - ".github/workflows/storage-contract.yml"
  pull_request:
    paths:
      - "platform/storage/**"
      - ".github/workflows/storage-contract.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node platform/storage/verify-storage-contract.mjs platform/storage/policy.json platform/storage/inventory.json
      - run: node platform/storage/test.mjs
