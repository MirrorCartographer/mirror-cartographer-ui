name: Observability authority contract
on:
  push:
    paths:
      - 'platform/observability/**'
      - '.github/workflows/observability-contract.yml'
  pull_request:
    paths:
      - 'platform/observability/**'
      - '.github/workflows/observability-contract.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node platform/observability/verify-observability-contract.mjs
      - run: node platform/observability/test.mjs
