name: Artifact custody and registry contract
on:
  push:
    paths: ["platform/artifact-registry/**", ".github/workflows/artifact-registry-contract.yml"]
  pull_request:
    paths: ["platform/artifact-registry/**", ".github/workflows/artifact-registry-contract.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node platform/artifact-registry/verify-artifact-registry-contract.mjs platform/artifact-registry/policy.json platform/artifact-registry/inventory.json
      - run: node platform/artifact-registry/test.mjs
      - run: node platform/artifact-registry/graph-catalog.mjs platform/artifact-registry/sample-graph.json /tmp/artifact-catalog.json
