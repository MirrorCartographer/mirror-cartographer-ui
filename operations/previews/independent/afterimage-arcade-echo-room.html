<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Afterimage Arcade — Echo Room</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#09090d;color:#f6f0df;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));pointer-events:none}.head,.foot{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.title{font-size:clamp(18px,4vw,44px);font-weight:800;letter-spacing:.12em}.sub,.readout{padding:7px 9px;border:1px solid #777;background:#09090dcc;font-size:11px}.readout{align-self:end;width:max-content}.controls{pointer-events:auto;display:flex;gap:8px}button{border:1px solid #aaa;background:#f6f0df;color:#09090d;padding:9px 11px;font:700 11px inherit;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:3px}@media(max-width:620px){.foot{font-size:9px}.sub{max-width:56%}}
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="Interactive abstract echo chamber. Drag to draw a gesture; release or press Space to send it through concentric luminous echoes."></canvas>
<div class="hud"><div class="head"><div><div class="title">ECHO ROOM</div><div class="sub">Every gesture returns slightly misremembered.</div></div><div class="controls"><button id="echo" type="button">SEND ECHO</button><button id="clear" type="button">CLEAR</button></div></div><div id="readout" class="readout" aria-live="polite">ECHO 00 · QUIET</div><div class="foot"><span>Drag: draw · Release/Space: echo</span><span>C: clear · reduced-motion aware</span></div></div>
<script>
(()=>{const c=document.querySelector('#stage'),x=c.getContext('2d'),out=document.querySelector('#readout');let w,h,dpr=1,t=0,drawing=false,gesture=[],echoes=[],count=0;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;function size(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}function point(e){const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width*w,(e.clientY-r.top)/r.height*h]}function begin(e){drawing=true;gesture=[point(e)];c.setPointerCapture?.(e.pointerId)}function move(e){if(!drawing)return;const p=point(e),q=gesture.at(-1);if(!q||Math.hypot(p[0]-q[0],p[1]-q[1])>4)gesture.push(p)}function send(){if(gesture.length<2){const cx=w/2,cy=h/2;gesture=Array.from({length:24},(_,i)=>{const a=i/23*Math.PI*2;return[cx+Math.cos(a)*70,cy+Math.sin(a)*70]})}count++;echoes.push({path:gesture.slice(),age:0,seed:count});gesture=[];drawing=false;out.textContent=`ECHO ${String(count).padStart(2,'0')} · RETURNING`}function clear(){gesture=[];echoes=[];count=0;out.textContent='ECHO 00 · QUIET'}function path(points,scale,dx,dy,alpha,hue){if(points.length<2)return;x.beginPath();points.forEach((p,i)=>{const px=(p[0]-w/2)*scale+w/2+dx,py=(p[1]-h/2)*scale+h/2+dy;i?x.lineTo(px,py):x.moveTo(px,py)});x.strokeStyle=`hsla(${hue},90%,70%,${alpha})`;x.lineWidth=1.2;x.stroke()}function frame(){t+=reduce?.002:.01;x.fillStyle='rgba(9,9,13,.13)';x.fillRect(0,0,w,h);x.globalCompositeOperation='lighter';path(gesture,1,0,0,.8,48);echoes.forEach(e=>{e.age+=reduce?.08:.35;for(let k=0;k<7;k++){const phase=e.age-k*7;if(phase<0)continue;const fade=Math.max(0,1-phase/150);const s=1+phase*.003;path(e.path,s,Math.sin(e.seed*2+k)*phase*.08,Math.cos(e.seed+k)*phase*.05,fade*.22,(e.seed*53+k*31+t*8)%360)}});echoes=echoes.filter(e=>e.age<170);x.globalCompositeOperation='source-over';if(!echoes.length&&!drawing&&count)out.textContent=`ECHO ${String(count).padStart(2,'0')} · FADED`;requestAnimationFrame(frame)}c.addEventListener('pointerdown',begin);c.addEventListener('pointermove',move);c.addEventListener('pointerup',send);c.addEventListener('pointercancel',()=>drawing=false);document.querySelector('#echo').addEventListener('click',send);document.querySelector('#clear').addEventListener('click',clear);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();send()}if(e.key.toLowerCase()==='c')clear()});addEventListener('resize',size);size();frame()})();
</script>
</body>
</html>
