<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Score Capsule</title><style>
:root{color-scheme:dark;--ink:#15110d;--paper:#ead9b7;--dim:#9f8d74;--line:#665441;--accent:#e66b3d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--ink);color:var(--paper);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:grid;place-items:center;padding:20px}main{width:min(760px,100%);display:grid;gap:18px}h1{margin:0;font:600 clamp(1.5rem,5vw,3rem)/1 Georgia,serif;letter-spacing:.06em}p{margin:.5rem 0 0;color:var(--dim);line-height:1.5}.palette,.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:transparent;color:var(--paper);padding:9px 12px;border-radius:999px;font:inherit}button[aria-pressed=true],button:focus-visible{background:var(--paper);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.cell{aspect-ratio:1;border-radius:10px;background:#211912;padding:0}.cell[data-weather=ash]{background:radial-gradient(circle at 50% 65%,#6d3828,#17120d 72%)}.cell[data-weather=rain]{background:repeating-linear-gradient(105deg,#15242b 0 8px,#1d3139 8px 10px)}.cell[data-weather=moths]{background:radial-gradient(ellipse at 35% 45%,#d7c59c 0 3%,transparent 4%),radial-gradient(ellipse at 65% 60%,#c2ae84 0 3%,transparent 4%),#211b28}.cell[data-weather=static]{background:repeating-linear-gradient(0deg,#2b2a24 0 2px,#17120d 2px 5px)}code{display:block;padding:12px;border:1px solid var(--line);overflow-wrap:anywhere;color:var(--accent)}@media(max-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main><header><h1>Weather Score Capsule</h1><p>Paint sixteen cells, then seal the score into the URL. Nothing is uploaded; the composition travels inside the fragment after #.</p></header><div class="palette" role="group" aria-label="Weather paint"><button data-paint="ash" aria-pressed="true">ash</button><button data-paint="rain">rain</button><button data-paint="moths">moths</button><button data-paint="static">static</button><button data-paint="">rest</button></div><section id="grid" class="grid" aria-label="Sixteen-cell weather score"></section><div class="actions"><button id="seal">seal capsule</button><button id="clear">clear</button></div><code id="token" aria-live="polite">unsealed</code></main><script type="module">
import {WEATHER,encodeScore,scoreFromHash} from './weather-score-capsules.mjs';
const grid=document.querySelector('#grid'),token=document.querySelector('#token'),paintButtons=[...document.querySelectorAll('[data-paint]')];let paint='ash';const cells=Array.from({length:16},(_,i)=>{const b=document.createElement('button');b.className='cell';b.type='button';b.dataset.weather='';b.setAttribute('aria-label',`Cell ${i+1}, rest`);b.addEventListener('click',()=>{b.dataset.weather=paint;b.setAttribute('aria-label',`Cell ${i+1}, ${paint||'rest'}`)});grid.append(b);return b});function select(value){paint=value;paintButtons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.paint===value)))}paintButtons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.paint)));function applyScore(score){score.forEach((value,i)=>{cells[i].dataset.weather=value;cells[i].setAttribute('aria-label',`Cell ${i+1}, ${value||'rest'}`)})}try{const restored=scoreFromHash(location.hash);if(restored){applyScore(restored);token.textContent='restored '+location.hash.slice(1)}}catch{token.textContent='invalid capsule ignored'}document.querySelector('#seal').addEventListener('click',async()=>{const value=encodeScore(cells.map(c=>c.dataset.weather));history.replaceState(null,'','#'+value);token.textContent=value;try{await navigator.clipboard.writeText(location.href);token.textContent=value+' · link copied'}catch{}});document.querySelector('#clear').addEventListener('click',()=>{applyScore(Array(16).fill(''));history.replaceState(null,'',location.pathname);token.textContent='cleared'});select('ash');
</script></body></html>
