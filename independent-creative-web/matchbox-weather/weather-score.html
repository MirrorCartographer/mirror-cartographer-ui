<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17120d"><title>Weather Score</title><style>
:root{color-scheme:dark;--paper:#ead9b7;--ink:#17120d;--ember:#e66b3d;--line:#665441;--dim:#a99880}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}main{width:min(980px,100%);display:grid;gap:18px}header{display:flex;justify-content:space-between;gap:16px;align-items:end}h1{margin:0;font:600 clamp(1.2rem,4vw,2.4rem)/1 Georgia,serif;letter-spacing:.08em}p{margin:.45rem 0 0;color:var(--dim);max-width:60ch;line-height:1.5}.transport,.palette{display:flex;gap:8px;flex-wrap:wrap}button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--paper);padding:9px 12px;border-radius:999px;font:inherit;cursor:pointer}button:hover,button:focus-visible,button[aria-pressed=true]{background:var(--paper);color:var(--ink);outline:2px solid transparent}.score{display:grid;grid-template-columns:repeat(8,minmax(44px,1fr));gap:8px}.beat{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:#211912;display:grid;place-items:center;position:relative;overflow:hidden}.beat::after{content:attr(data-index);position:absolute;right:6px;bottom:4px;font-size:.62rem;color:#8e7a61}.beat[data-weather=ash]{background:radial-gradient(circle at 50% 65%,#6d3828,#17120d 72%)}.beat[data-weather=rain]{background:repeating-linear-gradient(105deg,#15242b 0 8px,#1d3139 8px 10px)}.beat[data-weather=moths]{background:radial-gradient(ellipse at 35% 45%,#d7c59c 0 3%,transparent 4%),radial-gradient(ellipse at 65% 60%,#c2ae84 0 3%,transparent 4%),#211b28}.beat[data-weather=static]{background:repeating-linear-gradient(0deg,#2b2a24 0 2px,#17120d 2px 5px)}.beat.current{outline:3px solid var(--ember);outline-offset:2px}.legend{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--dim);font-size:.8rem}.status{color:var(--ember)}@media(max-width:640px){header{align-items:start;flex-direction:column}.score{grid-template-columns:repeat(4,1fr)}.legend{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main><header><div><h1>Weather Score</h1><p>Write sixteen beats of pocket climate. Choose a weather, then touch a square. Play is visual by default; sound only begins when you ask.</p></div><div class="transport"><button id="play" type="button" aria-pressed="false">play</button><button id="sound" type="button" aria-pressed="false">sound: off</button><button id="clear" type="button">clear</button></div></header><div class="palette" role="group" aria-label="Weather paint"><button data-paint="ash" aria-pressed="true">ash</button><button data-paint="rain" aria-pressed="false">rain</button><button data-paint="moths" aria-pressed="false">moths</button><button data-paint="static" aria-pressed="false">static</button></div><section class="score" id="score" aria-label="Sixteen beat weather score"></section><div class="legend"><span>Keys: 1–4 choose weather · arrows move · space paints · P plays</span><span class="status" id="status" aria-live="polite">ash selected</span></div></main><script>
(()=>{const names=['ash','rain','moths','static'],score=document.querySelector('#score'),status=document.querySelector('#status'),playBtn=document.querySelector('#play'),soundBtn=document.querySelector('#sound'),clearBtn=document.querySelector('#clear'),paintBtns=[...document.querySelectorAll('[data-paint]')],reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let paint='ash',cursor=0,step=-1,timer=null,sound=false,audio=null;const beats=Array.from({length:16},(_,i)=>{const b=document.createElement('button');b.type='button';b.className='beat';b.dataset.index=String(i+1);b.dataset.weather='';b.setAttribute('aria-label',`Beat ${i+1}, empty`);b.addEventListener('click',()=>apply(i));score.append(b);return b});function select(name){paint=name;paintBtns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.paint===name)));status.textContent=`${name} selected`}function apply(i){cursor=i;beats[i].dataset.weather=paint;beats[i].setAttribute('aria-label',`Beat ${i+1}, ${paint}`);status.textContent=`beat ${i+1}: ${paint}`;focusCursor()}function focusCursor(){beats.forEach((b,i)=>b.tabIndex=i===cursor?0:-1);beats[cursor].focus({preventScroll:true})}function tone(name){if(!sound)return;audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain(),freq={ash:146,rain:196,moths:247,static:311}[name]||98;o.type=name==='static'?'square':'sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.035,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.16);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.18)}function tick(){beats.forEach(b=>b.classList.remove('current'));step=(step+1)%16;const b=beats[step];b.classList.add('current');const name=b.dataset.weather;if(name){status.textContent=`playing beat ${step+1}: ${name}`;tone(name)}else status.textContent=`playing beat ${step+1}: rest`}function stop(){clearInterval(timer);timer=null;step=-1;beats.forEach(b=>b.classList.remove('current'));playBtn.textContent='play';playBtn.setAttribute('aria-pressed','false');status.textContent=`${paint} selected`}function play(){if(timer){stop();return}playBtn.textContent='stop';playBtn.setAttribute('aria-pressed','true');tick();timer=setInterval(tick,reduce?700:430)}paintBtns.forEach(b=>b.addEventListener('click',()=>select(b.dataset.paint)));playBtn.addEventListener('click',play);soundBtn.addEventListener('click',async()=>{sound=!sound;soundBtn.textContent=`sound: ${sound?'on':'off'}`;soundBtn.setAttribute('aria-pressed',String(sound));if(sound){audio??=new(window.AudioContext||window.webkitAudioContext)();await audio.resume()}});clearBtn.addEventListener('click',()=>{stop();beats.forEach((b,i)=>{b.dataset.weather='';b.setAttribute('aria-label',`Beat ${i+1}, empty`)});status.textContent='score cleared'});document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(/^[1-4]$/.test(e.key)){select(names[Number(e.key)-1]);e.preventDefault()}else if(e.key==='ArrowRight'){cursor=(cursor+1)%16;focusCursor();e.preventDefault()}else if(e.key==='ArrowLeft'){cursor=(cursor+15)%16;focusCursor();e.preventDefault()}else if(e.key===' '){apply(cursor);e.preventDefault()}else if(e.key.toLowerCase()==='p'){play();e.preventDefault()}});beats[0].tabIndex=0;beats.slice(1).forEach(b=>b.tabIndex=-1);select('ash')})();
</script></body></html>
