<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17120d"><title>Matchbox Weather</title><style>
:root{color-scheme:dark;--paper:#ead9b7;--ink:#17120d;--ember:#e66b3d;--dim:#9d8d75}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}body{display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}main{width:min(980px,100%);height:min(720px,92vh);display:grid;grid-template-rows:auto 1fr auto;gap:14px}header,footer{display:flex;justify-content:space-between;gap:14px;align-items:flex-end}h1{font-size:clamp(1rem,2.7vw,1.65rem);letter-spacing:.16em;text-transform:uppercase;margin:0;font-weight:600}p{margin:0;color:var(--dim);font-size:.78rem;line-height:1.45;max-width:52ch}.box{position:relative;border:1px solid #5e4e3c;border-radius:8px;background:#211912;box-shadow:0 24px 80px #0008,inset 0 0 0 8px #140f0b;overflow:hidden;touch-action:none}.box:focus-visible{outline:3px solid var(--paper);outline-offset:4px}canvas{display:block;width:100%;height:100%}.label{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%) rotate(-1.5deg);pointer-events:none;text-align:center;color:#2a2017;background:#d8bf91;padding:14px 18px;border:1px solid #8a704e;box-shadow:4px 5px 0 #0003;font-family:Georgia,serif;transition:opacity .4s}.label b{display:block;font-size:clamp(1rem,3vw,2rem)}.label span{font-size:.72rem;text-transform:uppercase;letter-spacing:.18em}.awake .label{opacity:.08}button{appearance:none;border:1px solid #7e6649;background:transparent;color:var(--paper);padding:8px 11px;border-radius:999px;font:inherit;font-size:.72rem;cursor:pointer}button:hover,button:focus-visible,button[aria-pressed=true]{background:#ead9b7;color:#17120d;outline:2px solid transparent}.controls{display:flex;gap:6px;flex-wrap:wrap}.status{min-width:9ch;text-align:right;color:var(--ember)}@media(max-width:600px){main{height:94svh}header{align-items:flex-start;flex-direction:column}.box{min-height:52vh}footer{align-items:flex-start;flex-direction:column}.status{text-align:left}.hint{display:none}}@media(prefers-reduced-motion:reduce){.label{transition:none}.box{background:radial-gradient(circle at 50% 45%,#473322,#17120d 70%)}}
</style></head><body><main><header><div><h1>Matchbox Weather</h1><p>A pocket climate. Drag to strike wind. Tap to seed weather. Choose a sky below.</p></div><button id="sound" type="button" aria-pressed="false">sound: off</button></header><section class="box" id="box" tabindex="0" role="application" aria-label="Interactive weather field. Tap or drag to make particles. Arrow keys change weather; space clears."><canvas id="sky"></canvas><div class="label" aria-hidden="true"><b>WEATHER</b><span>strike anywhere</span></div></section><footer><div class="controls" role="group" aria-label="Weather selection"><button data-mode="0" aria-pressed="true">ash</button><button data-mode="1" aria-pressed="false">rain</button><button data-mode="2" aria-pressed="false">moths</button><button data-mode="3" aria-pressed="false">static</button><button id="clear" type="button">clear</button></div><p class="status" id="status" aria-live="polite">ash</p></footer></main><script>
(()=>{const canvas=document.querySelector('#sky'),ctx=canvas.getContext('2d'),box=document.querySelector('#box'),status=document.querySelector('#status'),soundBtn=document.querySelector('#sound'),clearBtn=document.querySelector('#clear'),modeButtons=[...document.querySelectorAll('[data-mode]')],reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let dpr=1,w=0,h=0,last=0,mode=0,pointer=null,audio=null,sound=false;const names=['ash','rain','moths','static'],particles=[],rand=(a,b)=>a+Math.random()*(b-a);function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}function particle(x,y,force=1){const a=rand(0,Math.PI*2),s=rand(.2,2.8)*force;return{x,y,px:x,py:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(80,240),age:0,size:rand(.7,3.2),phase:rand(0,99)}}function tone(nx=.5,ny=.5){if(!sound)return;if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type=mode===3?'square':'sine';o.frequency.value=110+nx*520;f.type='lowpass';f.frequency.value=450+ny*1800;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.045,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.22);o.connect(f).connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.24)}function seed(x,y,n=18,force=1){box.classList.add('awake');if(reduce){tone(x/w,y/h);return}for(let i=0;i<n;i++)particles.push(particle(x,y,force));tone(x/w,y/h)}function setMode(next,announce=true){mode=(next+4)%4;particles.length=0;modeButtons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===mode)));status.textContent=`${names[mode]}${reduce?' — reduced motion':''}`;if(announce)seed(w/2,h/2,30,1)}function backdrop(t){const g=ctx.createRadialGradient(w*.5,h*.48,10,w*.5,h*.5,Math.max(w,h)*.72),palettes=[['#3a2d20','#100d0a'],['#203039','#080d10'],['#30283a','#0c0911'],['#30302c','#0b0b09']][mode];g.addColorStop(0,palettes[0]);g.addColorStop(1,palettes[1]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.globalAlpha=.13;ctx.strokeStyle='#ead9b7';for(let y=10;y<h;y+=9){ctx.beginPath();for(let x=0;x<=w;x+=18){const yy=y+Math.sin(x*.018+t*.0002+y)*1.7;x?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}ctx.stroke()}ctx.globalAlpha=1}function draw(p,t){p.px=p.x;p.py=p.y;p.age++;const life=1-p.age/p.life;if(mode===0){p.vy-=.008;ctx.fillStyle=`rgba(230,107,61,${life*.8})`;ctx.fillRect(p.x,p.y,p.size,p.size)}if(mode===1){p.vy+=.035;ctx.strokeStyle=`rgba(174,211,223,${life*.75})`;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2,p.y-8-p.vy*2);ctx.stroke()}if(mode===2){p.vx+=Math.sin(t*.004+p.phase)*.035;p.vy+=Math.cos(t*.003+p.phase)*.025;ctx.fillStyle=`rgba(234,217,183,${life*.7})`;ctx.fillRect(p.x-p.size*2,p.y-1,p.size*4,2)}if(mode===3){p.vx*=.985;p.vy*=.985;ctx.strokeStyle=`rgba(232,225,176,${life})`;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x+rand(-6,6),p.y+rand(-6,6));ctx.stroke()}p.x+=p.vx;p.y+=p.vy}function frame(t){last=t;backdrop(t);if(!reduce&&particles.length<[55,95,38,70][mode]&&Math.random()<.22)particles.push(particle(rand(0,w),mode===1?-5:rand(0,h),.25));for(let i=particles.length-1;i>=0;i--){draw(particles[i],t);const p=particles[i];if(p.age>p.life||p.x<-30||p.x>w+30||p.y>h+40)particles.splice(i,1)}requestAnimationFrame(frame)}function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}box.addEventListener('pointerdown',e=>{box.setPointerCapture(e.pointerId);pointer=point(e);seed(pointer.x,pointer.y,24,1.5)});box.addEventListener('pointermove',e=>{if(!pointer)return;const q=point(e),force=Math.min(4,Math.hypot(q.x-pointer.x,q.y-pointer.y)/12);seed(q.x,q.y,Math.ceil(force*3),force);pointer=q});box.addEventListener('pointerup',()=>pointer=null);box.addEventListener('pointercancel',()=>pointer=null);box.addEventListener('keydown',e=>{if(e.key===' '){particles.length=0;box.classList.remove('awake');status.textContent='clear';e.preventDefault()}else if(e.key==='ArrowRight'||e.key==='ArrowUp'){setMode(mode+1);e.preventDefault()}else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){setMode(mode-1);e.preventDefault()}});modeButtons.forEach(b=>b.addEventListener('click',()=>setMode(Number(b.dataset.mode))));clearBtn.addEventListener('click',()=>{particles.length=0;box.classList.remove('awake');status.textContent='clear'});soundBtn.addEventListener('click',async()=>{sound=!sound;soundBtn.textContent=`sound: ${sound?'on':'off'}`;soundBtn.setAttribute('aria-pressed',String(sound));if(sound){audio??=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();tone()}});new ResizeObserver(resize).observe(canvas);resize();setMode(0,false);requestAnimationFrame(frame)})();
</script></body></html>
