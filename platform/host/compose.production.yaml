services:
  app:
    image: ${FOUNDATION_IMAGE:?FOUNDATION_IMAGE is required}
    build:
      context: ./repository
      dockerfile: platform/host/Dockerfile.production
      args:
        FOUNDATION_COMMIT: ${FOUNDATION_COMMIT:?FOUNDATION_COMMIT is required}
    restart: unless-stopped
    read_only: true
    init: true
    pids_limit: ${FOUNDATION_APP_PIDS_LIMIT:-128}
    mem_limit: ${FOUNDATION_APP_MEMORY_LIMIT:-512m}
    cpus: ${FOUNDATION_APP_CPU_LIMIT:-1.0}
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: ${FOUNDATION_LOG_MAX_SIZE:-10m}
        max-file: ${FOUNDATION_LOG_MAX_FILES:-5}
    networks:
      - foundation-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  edge:
    # Pin the Caddy semantic release instead of following the floating 2.10
    # channel. The deployment evidence must still record the resolved image ID;
    # a registry digest pin is the remaining step for byte-level immutability.
    image: caddy:2.10.0-alpine
    pull_policy: always
    restart: unless-stopped
    init: true
    pids_limit: ${FOUNDATION_EDGE_PIDS_LIMIT:-128}
    mem_limit: ${FOUNDATION_EDGE_MEMORY_LIMIT:-256m}
    cpus: ${FOUNDATION_EDGE_CPU_LIMIT:-1.0}
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy
    environment:
      FOUNDATION_DOMAIN: ${FOUNDATION_DOMAIN:?FOUNDATION_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/foundation/data/caddy:/data
      - /srv/foundation/data/caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: ${FOUNDATION_LOG_MAX_SIZE:-10m}
        max-file: ${FOUNDATION_LOG_MAX_FILES:-5}
    networks:
      - edge-public
      - foundation-internal

networks:
  edge-public:
    driver: bridge
  foundation-internal:
    driver: bridge
    internal: true
