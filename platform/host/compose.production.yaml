services:
  app:
    image: ${FOUNDATION_IMAGE:?FOUNDATION_IMAGE is required}
    build:
      context: ./repository
      dockerfile: platform/host/Dockerfile.production
      args:
        FOUNDATION_COMMIT: ${FOUNDATION_COMMIT:?FOUNDATION_COMMIT is required}
    restart: unless-stopped
    read_only: true
    init: true
    pids_limit: ${FOUNDATION_APP_PIDS_LIMIT:-128}
    mem_limit: ${FOUNDATION_APP_MEMORY_LIMIT:-512m}
    cpus: ${FOUNDATION_APP_CPU_LIMIT:-1.0}
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: ${FOUNDATION_LOG_MAX_SIZE:-10m}
        max-file: ${FOUNDATION_LOG_MAX_FILES:-5}
    networks:
      - foundation-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  edge:
    # Keep the semantic default pinned while allowing deployment to export and
    # record the exact configured reference and its resolved registry digest.
    image: ${FOUNDATION_EDGE_IMAGE:-caddy:2.10.0-alpine}
    pull_policy: always
    restart: unless-stopped
    init: true
    pids_limit: ${FOUNDATION_EDGE_PIDS_LIMIT:-128}
    mem_limit: ${FOUNDATION_EDGE_MEMORY_LIMIT:-256m}
    cpus: ${FOUNDATION_EDGE_CPU_LIMIT:-1.0}
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy
    environment:
      FOUNDATION_DOMAIN: ${FOUNDATION_DOMAIN:?FOUNDATION_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/foundation/data/caddy:/data
      - /srv/foundation/data/caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      # Probe the actual HTTPS edge route, not merely the Caddy process. The
      # Host header selects the configured virtual host; certificate checking is
      # intentionally disabled because the loopback address cannot match the
      # public certificate. A successful probe still requires Caddy to terminate
      # TLS, route /healthz, reach the internal app, and receive a 2xx response.
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate --header=\"Host: $${FOUNDATION_DOMAIN}\" https://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${FOUNDATION_LOG_MAX_SIZE:-10m}
        max-file: ${FOUNDATION_LOG_MAX_FILES:-5}
    networks:
      - edge-public
      - foundation-internal

networks:
  edge-public:
    driver: bridge
  foundation-internal:
    driver: bridge
    internal: true
