services:
  app:
    image: ${FOUNDATION_IMAGE:?FOUNDATION_IMAGE is required}
    build:
      context: ./repository
      dockerfile: platform/host/Dockerfile.production
      args:
        FOUNDATION_COMMIT: ${FOUNDATION_COMMIT:?FOUNDATION_COMMIT is required}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /config:size=16m,mode=0700
      - /data:size=16m,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - foundation
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      FOUNDATION_DOMAIN: ${FOUNDATION_DOMAIN:?FOUNDATION_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/foundation/data/caddy:/data
      - /srv/foundation/data/caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - foundation

networks:
  foundation:
    driver: bridge
