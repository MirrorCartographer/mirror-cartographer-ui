global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    foundation_replica: ${PROMETHEUS_REPLICA}
    foundation_cell: ${FOUNDATION_CELL}

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager-1.internal:9093
            - alertmanager-2.internal:9093
            - alertmanager-3.internal:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
  - job_name: otel-collector
    static_configs:
      - targets: [127.0.0.1:8888]
  - job_name: node
    static_configs:
      - targets: [127.0.0.1:9100]
  - job_name: foundation-runtime
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:8080]

remote_write:
  - url: http://prometheus-mirror.internal:9090/api/v1/write
    queue_config:
      capacity: 20000
      max_shards: 20
      min_shards: 1
      max_samples_per_send: 5000
    write_relabel_configs:
      - source_labels: [__name__]
        regex: 'foundation_.*|up|prometheus_.*|otelcol_.*|node_.*'
        action: keep
